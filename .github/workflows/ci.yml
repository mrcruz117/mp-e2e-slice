name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm test

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t mp-e2e-slice:ci .
      # The image building is not the claim; the image serving is.
      - name: Run the image and serve a request
        run: |
          # The image ships real Feeds; this check is about serving, not about
          # what a publisher happened to publish, so it boots with none.
          docker run -d --name ci -p 8899:8899 -e PORT=8899 \
            -v "$PWD/e2e/feeds.empty.json:/app/feeds.json:ro" mp-e2e-slice:ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8899/api/items >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8899/ >/dev/null
          test "$(curl -sf http://127.0.0.1:8899/api/items)" = "[]"
      - if: always()
        run: docker logs ci || true

  # The oracle is only worth something if it still says what feedparser says.
  # No `npm ci`: the script uses nothing but Node's own modules, so this check
  # cannot be disarmed by anything in the dependency tree.
  oracle-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
      - name: The expectations still match the fixtures they were derived from
        run: npm run oracle:derive -- --check
      - name: The fixtures still match feedparser at the pinned commit
        run: npm run oracle:upstream

  # Lives in another repository so that a pull request cannot reach it, and is
  # pinned by SHA so that repository cannot silently change what it enforces.
  # Deleting this job does not disarm it: the required check simply never
  # reports, and the pull request stays unmergeable.
  oracle-guard:
    # A called workflow cannot be granted more than its caller holds, so the
    # guard's own `permissions:` block is a ceiling it can only reach from here.
    permissions:
      contents: read
      pull-requests: read
    uses: mrcruz117/mp-e2e-slice-oracle-guard/.github/workflows/oracle-guard.yml@744434b6e7c77bced31c7453cb955649aa1e6944
